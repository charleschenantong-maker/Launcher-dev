    $('chapterList').innerHTML=groups.map(g=>{
      const k=g.key,s=g.subject,c=g.chapter,items=g.items,open=expanded.has(k),dig=items.filter(x=>x.digested).length;
      return '<article class=&quot;chapter-card '+(open?'open':'')+'&quot; data-key=&quot;'+esc(k)+'&quot;><button class=&quot;chapter-head&quot; data-action=&quot;expand&quot;><span class=&quot;heat-strip&quot; style=&quot;background:'+heat(items.length,max)+'&quot;></span><span class=&quot;chapter-title&quot;><b>'+esc(c)+'</b><small>'+esc(s)+' · '+(items.length-dig)+' open / '+dig+' digested</small></span><span class=&quot;count-pill&quot;>'+items.length+' error'+(items.length===1?'':'s')+'</span><span class=&quot;chev&quot;>⌄</span></button><div class=&quot;records&quot;>'+(items.length?items.map(recordHTML).join(''):'<div style=&quot;padding:14px 2px;color:var(--muted);font-size:12px&quot;>No errors logged here yet.</div>')+'</div></article>';
    }).join('');
    $('chapterList').querySelectorAll('[data-action=expand]').forEach(b=>b.onclick=()=>{const card=b.closest('.chapter-card'),k=card.dataset.key;expanded.has(k)?expanded.delete(k):expanded.add(k);card.classList.toggle('open')});
    bindRecordActions($('chapterList'));
  };
  renderMatrix=function(){
    const sf=selectedPaperSubject,years=YEARS.slice().reverse(),papers=PAPERS[sf]||[],a=entries.filter(e=>e.subject===sf&amp;&amp;e.year&amp;&amp;e.paper);
    const count=(y,p)=>a.filter(e=>String(e.year)===String(y)&amp;&amp;e.paper===p).length,max=Math.max(1,...years.flatMap(y=>papers.map(p=>count(y,p))));
    let html='<div class=&quot;matrix-wrap&quot;><div class=&quot;matrix&quot; style=&quot;--cols:'+papers.length+'&quot;><div class=&quot;matrix-row&quot;><div></div>'+papers.map(p=>'<div class=&quot;matrix-label&quot; title=&quot;'+esc(p)+'&quot;>'+esc(paperShort(p))+'</div>').join('')+'</div>';
    years.forEach(y=>{html+='<div class=&quot;matrix-row&quot;><div class=&quot;matrix-label&quot;>'+esc(y)+'</div>'+papers.map(p=>{const n=count(y,p),key=y+'|||'+p;return '<button class=&quot;cell '+(n?'clickable':'')+'&quot; data-cell=&quot;'+esc(key)+'&quot; style=&quot;background:'+(n?heat(n,max):'#151d26')+'&quot; '+(n?'':'disabled')+'><b>'+n+'</b><small>'+(n===1?'error':'errors')+'</small></button>'}).join('')+'</div>'});
    $('paperMatrix').innerHTML=html+'</div></div>';
    $('paperMatrix').querySelectorAll('[data-cell]').forEach(c=>c.onclick=()=>{selectedCell=c.dataset.cell;renderPaperDetail(a)});
    if(selectedCell)renderPaperDetail(a);else $('paperDetail').innerHTML='';
  };
  renderPaperDetail=function(a){
    const parts=selectedCell.split('|||'),y=parts[0],p=parts.slice(1).join('|||'),items=a.filter(e=>String(e.year)===String(y)&amp;&amp;e.paper===p);
    $('paperDetail').innerHTML='<div class=&quot;paper-focus&quot;><div class=&quot;paper-focus-shell&quot;><div class=&quot;paper-focus-head&quot;><button class=&quot;ghost&quot; data-action=&quot;close-paper&quot;>← Back</button><h3>'+esc(y)+' · '+esc(p)+'</h3><span class=&quot;chapter-focus-count&quot;>'+items.length+' records</span></div><div class=&quot;paper-focus-records&quot;>'+(items.length?items.map(recordHTML).join(''):'<div class=&quot;empty&quot;><b>No errors logged here yet</b>This paper is clean so far.</div>')+'</div></div></div>';
    $('paperDetail').querySelector('[data-action=close-paper]').onclick=()=>{selectedCell=null;$('paperDetail').innerHTML=''};
    bindRecordActions($('paperDetail'));
  };
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&amp;&amp;selectedCell){selectedCell=null;$('paperDetail').innerHTML=''}});
  setup();
})();
</script>
