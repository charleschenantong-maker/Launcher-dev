<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code</title>
<link id="faviconLink" rel="icon" type="image/svg+xml" href="">
<style>
  :root{
    --radius-xl: 22px; --radius-l: 16px; --radius-m: 12px; --radius-s: 8px;
    --accent: #4E7FBE; --accent-rgb: 78,127,190; --accent-contrast: #ffffff;
    --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    --spring-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  [data-theme="dark"]{
    --bg-base:#08090b; --glass-bg:rgba(32,34,38,0.72); --glass-bg-strong:rgba(42,44,49,0.9);
    --glass-border:rgba(255,255,255,0.09); --text-primary:#f2f2f4; --text-secondary:rgba(235,235,245,0.62);
    --text-tertiary:rgba(235,235,245,0.38); --divider:rgba(255,255,255,0.09); --shadow:0 12px 40px rgba(0,0,0,.55);
    --track-bg:rgba(255,255,255,0.12); --sidebar-hover:rgba(255,255,255,0.06); --danger:#ff6b6b;
  }
  [data-theme="light"]{
    --bg-base:#eef0f3; --glass-bg:rgba(255,255,255,0.78); --glass-bg-strong:rgba(255,255,255,0.92);
    --glass-border:rgba(20,20,22,0.1); --text-primary:#16161a; --text-secondary:rgba(28,28,30,0.65);
    --text-tertiary:rgba(28,28,30,0.42); --divider:rgba(20,20,22,0.1); --shadow:0 12px 40px rgba(0,0,0,.18);
    --track-bg:rgba(0,0,0,0.08); --sidebar-hover:rgba(0,0,0,0.04); --danger:#d64545;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--font-family); background:var(--bg-base); color:var(--text-primary);
    overflow:hidden; transition:background .4s ease,color .3s ease; user-select:none;
  }
  *{ scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar{ width:0; height:0; display:none; }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001s !important; transition-duration:.1s !important; } }

  .glass{ background:var(--glass-bg); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); border:1px solid var(--glass-border); box-shadow:var(--shadow); }

  .ripple-target{ position:relative; }
  .ripple-target.glow-pulse::after{ content:""; position:absolute; inset:0; border-radius:inherit; animation:glowPulse .5s ease-out; pointer-events:none; }
  @keyframes glowPulse{ 0%{ box-shadow:0 0 0 0 rgba(var(--accent-rgb),.65), inset 0 0 12px 2px rgba(var(--accent-rgb),.5);} 100%{ box-shadow:0 0 16px 8px rgba(var(--accent-rgb),0), inset 0 0 12px 2px rgba(var(--accent-rgb),0);} }
  .ripple-target:active{ transform:scale(.95); transition:transform .1s ease; }

  /* ================= app shell ================= */
  .app{ height:100vh; display:flex; flex-direction:column; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; margin:10px 12px 0; border-radius:var(--radius-l); flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:750; letter-spacing:-.01em; }
  .brand-logo{ width:24px; height:24px; flex-shrink:0; filter:drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
  .topbar-actions{ display:flex; align-items:center; gap:8px; }
  .btn{ display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:100px; border:none; cursor:pointer; background:var(--track-bg); color:var(--text-primary); font-family:inherit; font-size:.85em; font-weight:600; }
  .btn.primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn svg{ width:15px; height:15px; flex-shrink:0; }
  .icon-btn{ width:36px; height:36px; border-radius:50%; border:none; background:var(--track-bg); color:var(--text-primary); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn.active{ background:rgba(var(--accent-rgb),.22); color:var(--accent); }

  .main-row{ flex:1; min-height:0; display:flex; gap:0; padding:12px; }

  /* ================= stage ================= */
  .stage-wrap{ flex:1; min-width:0; display:flex; }
  .stage{ position:relative; flex:1; border-radius:var(--radius-xl); overflow:hidden; background:#000; display:flex; align-items:center; justify-content:center; }
  #video{ width:100%; height:100%; background:#000; }
  .stage.mode-fit #video{ object-fit:contain; }
  .stage.mode-fill #video{ object-fit:cover; }
  .stage.mode-stretch #video{ object-fit:fill; }

  .drop-zone{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--text-secondary); text-align:center; background:radial-gradient(circle at 50% 40%, rgba(var(--accent-rgb),.14), transparent 60%); }
  .drop-zone svg{ width:52px; height:52px; color:var(--accent); opacity:.85; }
  .drop-zone p{ margin:0; font-size:1em; line-height:1.7; color:var(--text-secondary); max-width:320px; }
  .drop-zone.dragover{ background:rgba(var(--accent-rgb),.14); outline:2px dashed rgba(var(--accent-rgb),.55); outline-offset:-14px; }

  .center-play-btn{ position:absolute; width:72px; height:72px; border-radius:50%; background:rgba(0,0,0,.4); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .2s var(--spring-ease); }
  .center-play-btn svg{ width:30px; height:30px; color:#fff; margin-left:3px; }
  .center-play-btn.show{ opacity:1; pointer-events:auto; }
  .center-play-btn:active{ transform:scale(.9); }

  .stage.hide-controls{ cursor:none; }
  .stage.hide-controls .controls-bar,
  .stage.hide-controls .stage-topbar{ opacity:0; pointer-events:none; transform:translateY(6px); }

  .stage-topbar{ position:absolute; top:0; left:0; right:0; padding:16px 20px; display:flex; justify-content:space-between; align-items:flex-start; opacity:1; transition:opacity .3s ease, transform .3s ease; pointer-events:none; }
  .stage-topbar .now-title{ pointer-events:auto; padding:7px 14px; border-radius:100px; font-size:.82em; font-weight:600; max-width:60%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .controls-bar{ position:absolute; left:14px; right:14px; bottom:14px; border-radius:var(--radius-l); padding:10px 16px 14px; transition:opacity .3s ease, transform .3s ease; }

  .seek-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .seek-row span{ font-size:.72em; color:var(--text-tertiary); font-variant-numeric:tabular-nums; width:42px; flex-shrink:0; }
  .seek-row span:last-child{ text-align:right; }
  input[type="range"]{ -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:var(--track-bg); outline:none; cursor:pointer; }
  #seek{ flex:1; }
  #seek::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:linear-gradient(to right, var(--accent) var(--seek-pct,0%), var(--track-bg) 0); }
  #seek::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.4); margin-top:-4.5px; opacity:0; transition:opacity .15s ease; }
  .seek-row:hover #seek::-webkit-slider-thumb, #seek:active::-webkit-slider-thumb{ opacity:1; }

  .controls-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .controls-left, .controls-right{ display:flex; align-items:center; gap:4px; }
  .ctrl-btn{ background:none; border:none; cursor:pointer; color:var(--text-primary); display:flex; align-items:center; justify-content:center; padding:7px; border-radius:10px; flex-shrink:0; }
  .ctrl-btn svg{ width:18px; height:18px; }
  .ctrl-btn.play{ width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); }
  .ctrl-btn.play svg{ width:18px; height:18px; }
  .time-label{ font-size:.78em; color:var(--text-secondary); font-variant-numeric:tabular-nums; padding:0 4px; white-space:nowrap; }

  .vol-wrap{ display:flex; align-items:center; gap:6px; }
  .vol-wrap:hover #volSlider, .vol-wrap.expanded #volSlider{ width:70px; opacity:1; margin-left:2px; }
  #volSlider{ width:0; opacity:0; height:4px; transition:width .2s ease, opacity .2s ease; }
  #volSlider::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:linear-gradient(to right, var(--text-secondary) var(--vol-pct,80%), var(--track-bg) 0); }
  #volSlider::-webkit-slider-thumb{ -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--text-primary); margin-top:-3px; }

  /* popovers (speed / display mode) share the sleep-timer-style look */
  .pop-wrap{ position:relative; }
  .pop-menu{ position:absolute; bottom:calc(100% + 10px); right:0; min-width:150px; padding:8px; border-radius:var(--radius-m); z-index:20; opacity:0; transform:translateY(6px) scale(.96); pointer-events:none; transition:opacity .18s ease, transform .18s var(--spring-ease); background:var(--glass-bg-strong); backdrop-filter:blur(24px) saturate(160%); border:1px solid var(--glass-border); box-shadow:var(--shadow); }
  .pop-menu.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .pop-menu button{ display:block; width:100%; text-align:left; border:none; background:none; padding:8px 12px; border-radius:9px; font-family:inherit; font-size:.85em; color:var(--text-primary); cursor:pointer; }
  .pop-menu button:hover{ background:var(--track-bg); }
  .pop-menu button.active{ color:var(--accent); font-weight:700; }

  /* ================= playlist panel ================= */
  .playlist-panel{ width:0; margin-left:0; border-radius:var(--radius-l); overflow:hidden; transition:width .35s var(--spring-ease), margin-left .35s var(--spring-ease); flex-shrink:0; display:flex; flex-direction:column; }
  .playlist-panel.open{ width:300px; margin-left:12px; }
  .playlist-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px; flex-shrink:0; }
  .playlist-header h3{ margin:0; font-size:.95em; font-weight:750; }
  .playlist-count{ font-size:.75em; color:var(--text-tertiary); }
  .playlist-list{ flex:1; min-height:0; overflow-y:auto; padding:4px 10px 14px; }
  .playlist-empty{ text-align:center; padding:40px 16px; color:var(--text-tertiary); font-size:.82em; line-height:1.7; }
  .pl-item{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius-m); cursor:grab; margin-bottom:4px; }
  .pl-item:hover{ background:var(--track-bg); }
  .pl-item.playing{ background:rgba(var(--accent-rgb),.16); }
  .pl-item.dragging{ opacity:.4; }
  .pl-thumb{ width:34px; height:34px; border-radius:8px; background:var(--track-bg); display:flex; align-items:center; justify-content:center; color:var(--text-tertiary); flex-shrink:0; }
  .pl-thumb svg{ width:15px; height:15px; }
  .pl-item.playing .pl-thumb{ background:var(--accent); color:var(--accent-contrast); }
  .pl-info{ flex:1; min-width:0; }
  .pl-name{ font-size:.83em; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-item.playing .pl-name{ color:var(--accent); }
  .pl-remove{ width:24px; height:24px; border:none; background:none; color:var(--text-tertiary); cursor:pointer; border-radius:50%; display:none; align-items:center; justify-content:center; flex-shrink:0; }
  .pl-item:hover .pl-remove{ display:flex; }
  .pl-remove svg{ width:13px; height:13px; }

  /* ================= settings sheet ================= */
  #settingsBackdrop{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:60; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #settingsBackdrop.show{ opacity:1; pointer-events:auto; }
  #settingsSheet{ position:fixed; right:16px; top:70px; width:290px; z-index:61; padding:18px; border-radius:var(--radius-l); transform:translateY(-8px) scale(.97); opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s var(--spring-ease); }
  #settingsSheet.show{ transform:translateY(0) scale(1); opacity:1; pointer-events:auto; }
  .settings-title{ font-weight:750; margin-bottom:14px; font-size:.95em; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .settings-row span{ font-size:.85em; color:var(--text-secondary); }
  .settings-note{ font-size:.72em; color:var(--text-tertiary); line-height:1.6; margin-top:2px; }

  .toggle-switch{ width:42px; height:25px; border-radius:14px; background:var(--track-bg); border:none; cursor:pointer; position:relative; flex-shrink:0; transition:background .2s ease; }
  .toggle-switch::after{ content:""; position:absolute; top:2.5px; left:2.5px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:transform .2s ease; }
  .toggle-switch.on{ background:var(--accent); }
  .toggle-switch.on::after{ transform:translateX(17px); }

  /* ================= toast ================= */
  #toast{ position:fixed; left:50%; bottom:36px; transform:translateX(-50%) translateY(20px); padding:11px 20px; border-radius:100px; z-index:80; font-size:.85em; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s var(--spring-ease); }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  input[type="file"]{ display:none; }

  @media (max-width:820px){
    .playlist-panel.open{ width:240px; }
    .topbar-actions .btn span{ display:none; }
  }
</style>
</head>
<body data-theme="dark">

<div class="app">
  <header class="topbar glass">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 100 100" fill="none">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="100" y2="100">
            <stop offset="0" stop-color="#5B8FD6"/>
            <stop offset="1" stop-color="#28466E"/>
          </linearGradient>
          <linearGradient id="brandSheen" x1="0" y1="0" x2="0" y2="100">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
            <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="22" fill="url(#brandGrad)"/>
        <rect width="100" height="52" rx="22" fill="url(#brandSheen)"/>
        <path d="M41 32c0-3.2 3.4-5.2 6.2-3.6l24 14c2.8 1.6 2.8 5.6 0 7.2l-24 14c-2.8 1.6-6.2-.4-6.2-3.6z" fill="#ffffff"/>
      </svg>
      Code
    </div>
    <div class="topbar-actions">
      <button class="btn primary ripple-target" id="openBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span>打开视频</span>
      </button>
      <button class="icon-btn ripple-target" id="playlistToggleBtn" title="播放列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>
      <button class="icon-btn ripple-target" id="settingsBtn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="main-row">
    <div class="stage-wrap">
      <div class="stage mode-fit" id="stage">
        <video id="video" playsinline></video>

        <div class="drop-zone" id="dropZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
          <p>把视频拖到这里，或点击右上角"打开视频"导入<br>支持 MP4 / MOV / WebM / OGG，可以一次选多个</p>
          <button class="btn primary ripple-target" id="dropOpenBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>打开视频</span>
          </button>
        </div>

        <div class="stage-topbar">
          <div class="now-title glass" id="nowTitle" style="display:none;"></div>
        </div>

        <div class="center-play-btn" id="centerPlayBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" id="centerPlayIcon"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <div class="controls-bar glass" id="controlsBar" style="display:none;">
          <div class="seek-row">
            <span id="curTime">00:00</span>
            <input type="range" id="seek" min="0" max="1000" step="1" value="0">
            <span id="durTime">00:00</span>
          </div>
          <div class="controls-row">
            <div class="controls-left">
              <button class="ctrl-btn ripple-target" id="restartBtn" title="重新开始"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"/><path d="M3 4v5h5"/></svg></button>
              <button class="ctrl-btn ripple-target" id="prevBtn" title="上一个"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM10 12l10-7v14z"/></svg></button>
              <button class="ctrl-btn play ripple-target" id="playBtn" title="播放/暂停"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
              <button class="ctrl-btn ripple-target" id="nextBtn" title="下一个"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 5v14l10-7z"/></svg></button>
              <span class="time-label" id="timeLabel">00:00 / 00:00</span>
            </div>
            <div class="controls-right">
              <div class="vol-wrap" id="volWrap">
                <button class="ctrl-btn ripple-target" id="muteBtn" title="静音 (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="volIcon"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></button>
                <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
              </div>
              <div class="pop-wrap">
                <button class="ctrl-btn ripple-target" id="speedBtn" title="播放速度">
                  <span id="speedLabel" style="font-size:.78em; font-weight:700;">1x</span>
                </button>
                <div class="pop-menu" id="speedMenu">
                  <button data-speed="0.25">0.25x</button>
                  <button data-speed="0.5">0.5x</button>
                  <button data-speed="0.75">0.75x</button>
                  <button data-speed="1" class="active">1x（正常）</button>
                  <button data-speed="1.25">1.25x</button>
                  <button data-speed="1.5">1.5x</button>
                  <button data-speed="2">2x</button>
                </div>
              </div>
              <div class="pop-wrap">
                <button class="ctrl-btn ripple-target" id="displayBtn" title="显示模式">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="7" y="9" width="10" height="6" rx="1"/></svg>
                </button>
                <div class="pop-menu" id="displayMenu">
                  <button data-mode="fit" class="active">适应 Fit</button>
                  <button data-mode="fill">填满 Fill</button>
                  <button data-mode="stretch">拉伸 Stretch</button>
                </div>
              </div>
              <div class="pop-wrap">
                <button class="ctrl-btn ripple-target" id="audioTrackBtn" title="音轨" style="display:none;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </button>
                <div class="pop-menu" id="audioTrackMenu"></div>
              </div>
              <button class="ctrl-btn ripple-target" id="screenshotBtn" title="截图 (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
              <button class="ctrl-btn ripple-target" id="pipBtn" title="画中画"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg></button>
              <button class="ctrl-btn ripple-target" id="fullscreenBtn" title="全屏 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="fsIcon"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <aside class="playlist-panel glass" id="playlistPanel">
      <div class="playlist-header">
        <h3>播放列表</h3>
        <span class="playlist-count" id="playlistCount">0 个视频</span>
      </div>
      <div class="playlist-list" id="playlistList">
        <div class="playlist-empty" id="playlistEmpty">还没有视频<br>拖进来或者点"打开视频"导入</div>
      </div>
    </aside>
  </div>
</div>

<input type="file" id="fileInput" accept="video/mp4,video/quicktime,video/webm,video/ogg,.mp4,.mov,.webm,.ogv,.ogg" multiple>

<div id="settingsBackdrop"></div>
<div id="settingsSheet" class="glass">
  <div class="settings-title">设置</div>
  <div class="settings-row">
    <span>深色模式</span>
    <button class="toggle-switch ripple-target on" id="themeToggle"></button>
  </div>
  <div class="settings-row">
    <span>记住播放进度</span>
    <button class="toggle-switch ripple-target on" id="rememberPosToggle"></button>
  </div>
  <div class="settings-note">音量、播放速度、主题和上次播放位置会自动保存在本机浏览器里，重新打开同一个视频文件时会从上次的位置继续播放。视频文件本身不会被保存，刷新页面需要重新导入。</div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  /* ================= glow feedback ================= */
  document.addEventListener("pointerdown", (e) => {
    const el = e.target.closest(".ripple-target");
    if(!el) return;
    el.classList.remove("glow-pulse");
    void el.offsetWidth;
    el.classList.add("glow-pulse");
  });

  /* ================= state ================= */
  const video = $("#video");
  const stage = $("#stage");
  const playlist = []; // {id, name, url, file, size}
  let currentIndex = -1;
  let idCounter = 0;
  let isPlaying = false;
  let displayMode = "fit";
  let rememberPos = true;

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60).toString().padStart(2,"0");
    const s = Math.floor(sec%60).toString().padStart(2,"0");
    return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function posKey(t){ return "vp_pos_" + t.name + "_" + t.size; }

  let toastTimer = null;
  function toast(msg){
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ================= adding videos ================= */
  function addFiles(fileList){
    const files = Array.from(fileList).filter(f => f.type.startsWith("video/") || /\.(mp4|mov|webm|ogv|ogg|m4v)$/i.test(f.name));
    if(files.length === 0){ if(fileList.length) toast("没有找到可识别的视频文件"); return; }
    files.forEach(file => {
      const url = URL.createObjectURL(file);
      playlist.push({ id: idCounter++, name: file.name, url, file, size: file.size, audioProbe: null, audioBlobCache: {}, activeAudioIdx: null });
    });
    renderPlaylist();
    if(currentIndex === -1) playAt(0);
    toast(files.length > 1 ? `已导入 ${files.length} 个视频` : `已导入 ${files[0].name}`);
  }

  /* ================= playback ================= */
  function playAt(idx){
    if(idx < 0 || idx >= playlist.length) return;
    if(currentIndex !== -1) savePosition();
    currentIndex = idx;
    const t = playlist[idx];
    video.src = (t.activeAudioIdx != null && t.audioBlobCache[t.activeAudioIdx]) ? t.audioBlobCache[t.activeAudioIdx] : t.url;
    $("#dropZone").style.display = "none";
    $("#controlsBar").style.display = "block";
    $("#nowTitle").style.display = "inline-block";
    $("#nowTitle").textContent = t.name;
    $("#audioTrackBtn").style.display = "flex";
    video.playbackRate = video.playbackRate || 1;
    const resume = rememberPos ? parseFloat(localStorage.getItem(posKey(t))||"0") : 0;
    video.addEventListener("loadedmetadata", function onMeta(){
      video.removeEventListener("loadedmetadata", onMeta);
      if(resume > 1 && resume < video.duration - 2) video.currentTime = resume;
    });
    video.play().catch(()=>{});
    renderPlaylist();
  }
  function savePosition(){
    if(!rememberPos || currentIndex === -1) return;
    const t = playlist[currentIndex];
    if(!t || !video.duration) return;
    try{ localStorage.setItem(posKey(t), String(video.currentTime)); }catch(e){}
  }
  function togglePlay(){ if(video.src) video.paused ? video.play() : video.pause(); }
  function nextVideo(){ if(playlist.length) playAt((currentIndex+1) % playlist.length); }
  function prevVideo(){ if(playlist.length) playAt((currentIndex-1+playlist.length) % playlist.length); }
  function restart(){ if(video.src){ video.currentTime = 0; video.play().catch(()=>{}); } }

  function removeAt(idx){
    const wasCurrent = idx === currentIndex;
    URL.revokeObjectURL(playlist[idx].url);
    Object.values(playlist[idx].audioBlobCache || {}).forEach(u => URL.revokeObjectURL(u));
    playlist.splice(idx,1);
    if(idx < currentIndex) currentIndex--;
    else if(wasCurrent){
      currentIndex = -1;
      video.pause(); video.removeAttribute("src"); video.load();
      $("#controlsBar").style.display = "none";
      $("#nowTitle").style.display = "none";
      $("#audioTrackBtn").style.display = "none";
      if(playlist.length) playAt(Math.min(idx, playlist.length-1));
      else { $("#dropZone").style.display = "flex"; }
    }
    renderPlaylist();
  }

  /* ================= playlist rendering + drag reorder ================= */
  function renderPlaylist(){
    const list = $("#playlistList");
    $("#playlistCount").textContent = playlist.length + " 个视频";
    $("#playlistEmpty").style.display = playlist.length ? "none" : "block";
    list.querySelectorAll(".pl-item").forEach(n => n.remove());
    playlist.forEach((t, idx) => {
      const item = document.createElement("div");
      item.className = "pl-item ripple-target" + (idx===currentIndex ? " playing" : "");
      item.draggable = true;
      item.dataset.idx = idx;
      item.innerHTML = `
        <div class="pl-thumb">${idx===currentIndex && isPlaying
          ? '<svg viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px;"><path d="M8 5v14l11-7z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 012-2h9a2 2 0 012 2v3.2l4-2.2v11.9l-4-2.2V19a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>'}</div>
        <div class="pl-info"><div class="pl-name">${escapeHtml(t.name)}</div></div>
        <button class="pl-remove ripple-target" data-idx="${idx}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
      item.addEventListener("click", (e) => { if(e.target.closest(".pl-remove")) return; playAt(idx); });
      item.querySelector(".pl-remove").addEventListener("click", (e) => { e.stopPropagation(); removeAt(idx); });
      list.appendChild(item);
    });
    wireDragReorder(list);
  }
  function wireDragReorder(list){
    let dragIdx = null;
    list.querySelectorAll(".pl-item").forEach(item => {
      item.addEventListener("dragstart", () => { dragIdx = +item.dataset.idx; item.classList.add("dragging"); });
      item.addEventListener("dragend", () => { item.classList.remove("dragging"); });
      item.addEventListener("dragover", (e) => { e.preventDefault(); });
      item.addEventListener("drop", (e) => {
        e.preventDefault();
        const dropIdx = +item.dataset.idx;
        if(dragIdx === null || dragIdx === dropIdx) return;
        const moved = playlist.splice(dragIdx,1)[0];
        playlist.splice(dropIdx,0,moved);
        if(currentIndex === dragIdx) currentIndex = dropIdx;
        else if(dragIdx < currentIndex && dropIdx >= currentIndex) currentIndex--;
        else if(dragIdx > currentIndex && dropIdx <= currentIndex) currentIndex++;
        renderPlaylist();
      });
    });
  }

  /* ================= import: file picker + drag&drop ================= */
  const fileInput = $("#fileInput");
  $("#openBtn").addEventListener("click", () => fileInput.click());
  $("#dropOpenBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", (e) => { addFiles(e.target.files); fileInput.value=""; });

  let dragCounter = 0;
  ["dragenter","dragover"].forEach(evt => stage.addEventListener(evt, (e) => {
    e.preventDefault();
    if(evt === "dragenter") dragCounter++;
    $("#dropZone").style.display = "flex";
    $("#dropZone").classList.add("dragover");
  }));
  stage.addEventListener("dragleave", (e) => {
    e.preventDefault(); dragCounter--;
    if(dragCounter <= 0){
      dragCounter = 0;
      $("#dropZone").classList.remove("dragover");
      if(currentIndex !== -1) $("#dropZone").style.display = "none";
    }
  });
  stage.addEventListener("drop", (e) => {
    e.preventDefault(); dragCounter = 0;
    $("#dropZone").classList.remove("dragover");
    if(currentIndex !== -1) $("#dropZone").style.display = "none";
    if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  /* ================= transport controls ================= */
  $("#playBtn").addEventListener("click", togglePlay);
  $("#restartBtn").addEventListener("click", restart);
  $("#nextBtn").addEventListener("click", nextVideo);
  $("#prevBtn").addEventListener("click", prevVideo);
  $("#centerPlayBtn").addEventListener("click", togglePlay);
  stage.addEventListener("dblclick", (e) => { if(!e.target.closest(".controls-bar")) toggleFullscreen(); });
  stage.addEventListener("click", (e) => {
    if(e.target.closest(".controls-bar") || e.target.closest(".drop-zone") || e.target.closest(".center-play-btn")) return;
    if(video.src) togglePlay();
  });

  function updatePlayIcon(){
    const svg = isPlaying ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $("#playIcon").innerHTML = svg;
    $("#centerPlayIcon").innerHTML = svg;
  }
  video.addEventListener("play", () => { isPlaying = true; updatePlayIcon(); flashCenterBtn(); renderPlaylist(); resetHideTimer(); });
  video.addEventListener("pause", () => { isPlaying = false; updatePlayIcon(); flashCenterBtn(); renderPlaylist(); showControls(); });
  video.addEventListener("ended", () => { savePosition(); if(playlist.length > 1) nextVideo(); });
  video.addEventListener("loadedmetadata", () => { $("#durTime").textContent = fmtTime(video.duration); updateTimeLabel(); });

  /* ================= audio tracks (ffmpeg.wasm probe + remux) =================
     浏览器原生 video.audioTracks 在普通 src= 播放下基本不暴露多轨（需要
     chrome://flags/#enable-experimental-web-platform-features 才行，且仍不稳定），
     所以这里用 ffmpeg.wasm 在浏览器本地探测音轨、并在切换时把选中音轨重新封装成
     浏览器能播的 mp4（视频流直接 copy 不重新编码，只重新编码音频，所以比较快）。
     首次点"音轨"按钮才会懒加载 ffmpeg.wasm（~25MB），不影响不需要这个功能的用户。 */
  let ffmpegInstance = null, ffmpegLoadingPromise = null, ffLogBuf = "";
  function loadFFmpeg(){
    if(ffmpegInstance) return Promise.resolve(ffmpegInstance);
    if(ffmpegLoadingPromise) return ffmpegLoadingPromise;
    ffmpegLoadingPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js";
      s.onload = async () => {
        try{
          const { createFFmpeg } = window.FFmpeg;
          const ff = createFFmpeg({
            log:false,
            logger: ({message}) => { ffLogBuf += message + "\n"; },
            corePath: "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"
          });
          await ff.load();
          ffmpegInstance = ff;
          resolve(ff);
        }catch(err){ reject(err); }
      };
      s.onerror = () => reject(new Error("ffmpeg.wasm 加载失败，检查网络"));
      document.head.appendChild(s);
    });
    return ffmpegLoadingPromise;
  }
  function extOf(name){ const m = name.match(/\.[^.]+$/); return m ? m[0] : ".mp4"; }
  async function probeAudioTracks(t){
    const ff = await loadFFmpeg();
    const { fetchFile } = window.FFmpeg;
    const inName = "probe_in" + extOf(t.name);
    try{ ff.FS("unlink", inName); }catch(e){}
    ff.FS("writeFile", inName, await fetchFile(t.file));
    ffLogBuf = "";
    try{ await ff.run("-i", inName); }catch(e){ /* 没给输出文件，ffmpeg 本来就会报错，探测信息已经在 log 里了 */ }
    try{ ff.FS("unlink", inName); }catch(e){}
    const tracks = [];
    const re = /Stream #0:\d+(?:\((\w+)\))?[^\n]*: Audio: ([^,\n]+)/g;
    let m;
    while((m = re.exec(ffLogBuf))){ tracks.push({ lang: m[1] || "", codec: m[2].trim() }); }
    return tracks;
  }
  async function remuxAudioTrack(t, audioIdx){
    const ff = await loadFFmpeg();
    const { fetchFile } = window.FFmpeg;
    const inName = "in" + extOf(t.name), outName = "out_" + t.id + "_" + audioIdx + ".mp4";
    try{ ff.FS("unlink", inName); }catch(e){}
    ff.FS("writeFile", inName, await fetchFile(t.file));
    await ff.run("-i", inName, "-map","0:v:0","-map",`0:a:${audioIdx}`,"-c:v","copy","-c:a","aac","-b:a","192k","-movflags","+faststart", outName);
    const data = ff.FS("readFile", outName);
    const blob = new Blob([data.buffer], { type:"video/mp4" });
    try{ ff.FS("unlink", inName); ff.FS("unlink", outName); }catch(e){}
    return URL.createObjectURL(blob);
  }
  function renderAudioTrackMenu(){
    const t = playlist[currentIndex];
    const menu = $("#audioTrackMenu");
    menu.innerHTML = "";
    if(!t) return;
    if(!t.audioProbe){
      const b = document.createElement("button");
      b.textContent = "检测音轨（首次要加载解码器，稍慢）";
      b.addEventListener("click", async (e) => {
        e.stopPropagation();
        b.textContent = "检测中…"; b.disabled = true;
        try{ t.audioProbe = await probeAudioTracks(t); }
        catch(err){ toast("检测失败：" + err.message); t.audioProbe = []; }
        renderAudioTrackMenu();
      });
      menu.appendChild(b);
      return;
    }
    if(t.audioProbe.length <= 1){
      const b = document.createElement("button");
      b.textContent = "只有 1 条音轨";
      b.disabled = true;
      menu.appendChild(b);
      return;
    }
    t.audioProbe.forEach((tr, idx) => {
      const b = document.createElement("button");
      b.textContent = (tr.lang ? `音轨 ${idx+1} · ${tr.lang}` : `音轨 ${idx+1}`) + ` (${tr.codec})`;
      const active = (t.activeAudioIdx == null ? 0 : t.activeAudioIdx) === idx;
      b.classList.toggle("active", active);
      b.addEventListener("click", async (e) => {
        e.stopPropagation();
        await switchAudioTrack(t, idx);
        closeAllPopovers();
      });
      menu.appendChild(b);
    });
  }
  async function switchAudioTrack(t, idx){
    if((t.activeAudioIdx == null ? 0 : t.activeAudioIdx) === idx) return;
    const wasTime = video.currentTime, wasPlaying = !video.paused;
    if(t.audioBlobCache[idx]){
      video.src = t.audioBlobCache[idx];
    } else {
      toast("正在切换音轨，视频越大越慢，等一下…");
      try{
        const url = await remuxAudioTrack(t, idx);
        t.audioBlobCache[idx] = url;
        video.src = url;
      }catch(err){ toast("切换失败：" + err.message); return; }
    }
    t.activeAudioIdx = idx;
    video.addEventListener("loadedmetadata", function onMeta(){
      video.removeEventListener("loadedmetadata", onMeta);
      video.currentTime = wasTime;
      if(wasPlaying) video.play().catch(()=>{});
    });
    renderAudioTrackMenu();
  }
  video.addEventListener("error", () => { if(video.src) toast("这个视频格式播放不了，换一个试试"); });

  let centerBtnTimer = null;
  function flashCenterBtn(){
    const btn = $("#centerPlayBtn");
    btn.classList.add("show");
    clearTimeout(centerBtnTimer);
    centerBtnTimer = setTimeout(() => btn.classList.remove("show"), 550);
  }

  /* ================= seek ================= */
  let seeking = false;
  video.addEventListener("timeupdate", () => {
    if(!video.duration || seeking) return;
    const pct = (video.currentTime/video.duration)*100;
    $("#seek").value = Math.round((video.currentTime/video.duration)*1000);
    $("#seek").style.setProperty("--seek-pct", pct+"%");
    $("#curTime").textContent = fmtTime(video.currentTime);
    updateTimeLabel();
    if(Math.floor(video.currentTime) % 3 === 0) savePosition();
  });
  function updateTimeLabel(){ $("#timeLabel").textContent = fmtTime(video.currentTime) + " / " + fmtTime(video.duration||0); }
  $("#seek").addEventListener("pointerdown", () => seeking = true);
  $("#seek").addEventListener("pointerup", () => seeking = false);
  $("#seek").addEventListener("input", () => {
    if(!video.duration) return;
    const ratio = $("#seek").value/1000;
    video.currentTime = ratio * video.duration;
    $("#seek").style.setProperty("--seek-pct", (ratio*100)+"%");
    $("#curTime").textContent = fmtTime(video.currentTime);
  });
  function seekBy(delta){ if(video.duration) video.currentTime = Math.min(video.duration, Math.max(0, video.currentTime+delta)); }

  /* ================= volume ================= */
  let lastVol = 0.8;
  function updateVolIcon(){
    const v = video.muted ? 0 : video.volume;
    $("#volIcon").innerHTML = v===0 ? '<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M23 9l-6 6M17 9l6 6"/>'
      : v<0.5 ? '<path d="M11 5L6 9H2v6h4l5 4z"/>'
      : '<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/>';
  }
  $("#volSlider").addEventListener("input", () => {
    const v = parseFloat($("#volSlider").value);
    video.volume = v; video.muted = v===0;
    $("#volSlider").style.setProperty("--vol-pct", (v*100)+"%");
    updateVolIcon(); saveSettings();
  });
  $("#muteBtn").addEventListener("click", () => {
    if(video.muted || video.volume===0){ video.muted=false; video.volume = lastVol||0.8; }
    else { lastVol = video.volume; video.muted = true; }
    $("#volSlider").value = video.muted ? 0 : video.volume;
    $("#volSlider").style.setProperty("--vol-pct", ((video.muted?0:video.volume)*100)+"%");
    updateVolIcon(); saveSettings();
  });

  /* ================= speed popover ================= */
  function closeAllPopovers(){ $$(".pop-menu").forEach(m => m.classList.remove("show")); }
  $("#speedBtn").addEventListener("click", (e) => { e.stopPropagation(); const m=$("#speedMenu"); const open=m.classList.contains("show"); closeAllPopovers(); if(!open) m.classList.add("show"); });
  $("#speedMenu").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if(!b) return;
    const rate = parseFloat(b.dataset.speed);
    video.playbackRate = rate;
    $("#speedLabel").textContent = rate + "x";
    $$("#speedMenu button").forEach(x => x.classList.toggle("active", x===b));
    closeAllPopovers(); saveSettings();
  });

  /* ================= display mode popover ================= */
  $("#displayBtn").addEventListener("click", (e) => { e.stopPropagation(); const m=$("#displayMenu"); const open=m.classList.contains("show"); closeAllPopovers(); if(!open) m.classList.add("show"); });
  $("#audioTrackBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    const m=$("#audioTrackMenu"); const open=m.classList.contains("show");
    closeAllPopovers();
    if(!open){ renderAudioTrackMenu(); m.classList.add("show"); }
  });
  $("#displayMenu").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if(!b) return;
    displayMode = b.dataset.mode;
    stage.classList.remove("mode-fit","mode-fill","mode-stretch");
    stage.classList.add("mode-"+displayMode);
    $$("#displayMenu button").forEach(x => x.classList.toggle("active", x===b));
    closeAllPopovers(); saveSettings();
  });
  document.addEventListener("click", closeAllPopovers);

  /* ================= screenshot ================= */
  $("#screenshotBtn").addEventListener("click", takeScreenshot);
  function takeScreenshot(){
    if(!video.src || !video.videoWidth){ toast("先打开一个视频再截图"); return; }
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      const stamp = fmtTime(video.currentTime).replace(/:/g,"-");
      a.href = URL.createObjectURL(blob);
      a.download = `截图_${stamp}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("截图已保存");
    }, "image/png");
  }

  /* ================= picture-in-picture ================= */
  $("#pipBtn").addEventListener("click", async () => {
    try{
      if(document.pictureInPictureElement) await document.exitPictureInPicture();
      else if(video.src) await video.requestPictureInPicture();
      else toast("先打开一个视频");
    }catch(e){ toast("这个浏览器不支持画中画"); }
  });

  /* ================= fullscreen ================= */
  function toggleFullscreen(){
    if(document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen().catch(()=>toast("无法进入全屏"));
  }
  $("#fullscreenBtn").addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", () => {
    const fs = !!document.fullscreenElement;
    $("#fsIcon").innerHTML = fs
      ? '<path d="M8 3v3a2 2 0 01-2 2H3M16 3v3a2 2 0 002 2h3M8 21v-3a2 2 0 00-2-2H3M16 21v-3a2 2 0 012-2h3"/>'
      : '<path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/>';
  });

  /* ================= auto-hide controls ================= */
  let hideTimer = null;
  function showControls(){
    stage.classList.remove("hide-controls");
    clearTimeout(hideTimer);
    if(isPlaying) hideTimer = setTimeout(() => { if(!$$(".pop-menu.show").length) stage.classList.add("hide-controls"); }, 2600);
  }
  function resetHideTimer(){ showControls(); }
  stage.addEventListener("mousemove", showControls);
  stage.addEventListener("mouseleave", () => { if(isPlaying) stage.classList.add("hide-controls"); });
  $("#controlsBar").addEventListener("mouseenter", () => clearTimeout(hideTimer));
  $("#controlsBar").addEventListener("mouseleave", showControls);

  /* ================= keyboard shortcuts ================= */
  document.addEventListener("keydown", (e) => {
    if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
    switch(e.key.toLowerCase()){
      case " ": e.preventDefault(); togglePlay(); break;
      case "arrowleft": seekBy(-5); break;
      case "arrowright": seekBy(5); break;
      case "arrowup": e.preventDefault(); video.volume = Math.min(1, video.volume+0.05); video.muted=false; $("#volSlider").value=video.volume; $("#volSlider").style.setProperty("--vol-pct",(video.volume*100)+"%"); updateVolIcon(); saveSettings(); break;
      case "arrowdown": e.preventDefault(); video.volume = Math.max(0, video.volume-0.05); $("#volSlider").value=video.volume; $("#volSlider").style.setProperty("--vol-pct",(video.volume*100)+"%"); updateVolIcon(); saveSettings(); break;
      case "f": toggleFullscreen(); break;
      case "m": $("#muteBtn").click(); break;
      case "s": takeScreenshot(); break;
      case "n": nextVideo(); break;
    }
  });

  /* ================= playlist panel toggle ================= */
  $("#playlistToggleBtn").addEventListener("click", () => {
    $("#playlistPanel").classList.toggle("open");
    $("#playlistToggleBtn").classList.toggle("active");
  });

  /* ================= settings sheet ================= */
  function openSettings(){ $("#settingsSheet").classList.add("show"); $("#settingsBackdrop").classList.add("show"); }
  function closeSettings(){ $("#settingsSheet").classList.remove("show"); $("#settingsBackdrop").classList.remove("show"); }
  $("#settingsBtn").addEventListener("click", (e) => { e.stopPropagation(); openSettings(); });
  $("#settingsBackdrop").addEventListener("click", closeSettings);

  function applyTheme(dark){ document.body.setAttribute("data-theme", dark ? "dark" : "light"); $("#themeToggle").classList.toggle("on", dark); }
  $("#themeToggle").addEventListener("click", () => { applyTheme(!$("#themeToggle").classList.contains("on")); saveSettings(); });
  $("#rememberPosToggle").addEventListener("click", () => {
    rememberPos = !rememberPos;
    $("#rememberPosToggle").classList.toggle("on", rememberPos);
    saveSettings();
  });

  /* ================= persistence ================= */
  function saveSettings(){
    try{
      localStorage.setItem("vp_settings", JSON.stringify({
        volume: video.volume, muted: video.muted, rate: video.playbackRate,
        dark: document.body.getAttribute("data-theme")==="dark",
        displayMode, rememberPos
      }));
    }catch(e){}
  }
  function loadSettings(){
    let p; try{ p = JSON.parse(localStorage.getItem("vp_settings")); }catch(e){}
    if(!p) return;
    video.volume = p.volume !== undefined ? p.volume : 0.8;
    video.muted = !!p.muted;
    $("#volSlider").value = video.muted ? 0 : video.volume;
    $("#volSlider").style.setProperty("--vol-pct", ((video.muted?0:video.volume)*100)+"%");
    updateVolIcon();
    video.playbackRate = p.rate || 1;
    $("#speedLabel").textContent = (p.rate||1) + "x";
    $$("#speedMenu button").forEach(b => b.classList.toggle("active", parseFloat(b.dataset.speed)===(p.rate||1)));
    applyTheme(p.dark !== false);
    displayMode = p.displayMode || "fit";
    stage.classList.remove("mode-fit","mode-fill","mode-stretch");
    stage.classList.add("mode-"+displayMode);
    $$("#displayMenu button").forEach(b => b.classList.toggle("active", b.dataset.mode===displayMode));
    rememberPos = p.rememberPos !== false;
    $("#rememberPosToggle").classList.toggle("on", rememberPos);
  }

  window.addEventListener("beforeunload", savePosition);
  setInterval(savePosition, 5000);

  /* ================= init ================= */
  function setFavicon(){
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="100" y2="100"><stop offset="0" stop-color="#5B8FD6"/><stop offset="1" stop-color="#28466E"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="0" y2="100"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#g)"/><rect width="100" height="52" rx="22" fill="url(#s)"/><path d="M41 32c0-3.2 3.4-5.2 6.2-3.6l24 14c2.8 1.6 2.8 5.6 0 7.2l-24 14c-2.8 1.6-6.2-.4-6.2-3.6z" fill="#ffffff"/></svg>`;
    const link = document.getElementById("faviconLink");
    if(link) link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  }

  /* ================= init ================= */
  setFavicon();
  loadSettings();
  renderPlaylist();
})();
</script>
</body>
</html>
