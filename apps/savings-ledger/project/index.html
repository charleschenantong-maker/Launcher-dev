<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存钱台账 · Savings Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310161c'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23c08a4e'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%2310161c' stroke-width='2' stroke-dasharray='2 3.2'/%3E%3Ctext x='32' y='40' font-family='Georgia,serif' font-size='24' font-weight='700' text-anchor='middle' fill='%2310161c'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10161c;
    --ink-2:#161e26;
    --paper:#f4efe3;
    --paper-dim:#e7dfcb;
    --copper:#c08a4e;
    --copper-bright:#d9a463;
    --rust:#a3432f;
    --pine:#4a6b57;
    --line: rgba(244,239,227,0.14);
    --muted: rgba(244,239,227,0.55);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2430 0%, transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:32px 18px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--copper-bright);
    display:flex;align-items:center;gap:10px;
    margin-bottom:6px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--copper-bright);}

  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(30px,6vw,42px);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted);font-size:14px;margin-bottom:26px;}

  .totals{
    display:flex;gap:22px;flex-wrap:wrap;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:14px 0;
    margin-bottom:30px;
  }
  .totals .t-item{font-family:'JetBrains Mono',monospace;}
  .totals .t-item span{display:block;}
  .totals .t-label{font-size:10px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}
  .totals .t-value{font-size:18px;color:var(--copper-bright);font-weight:700;margin-top:2px;}

  /* ---- add goal card ---- */
  .add-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:34px;
  }
  .add-card h2{
    font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 14px;
    color:var(--paper);
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px;}
  label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-family:'JetBrains Mono',monospace;}
  input,select{
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--paper);
    padding:9px 10px;
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
    width:100%;
  }
  input:focus,select:focus{border-color:var(--copper);}
  input::placeholder{color:rgba(244,239,227,0.3);}

  .btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;letter-spacing:0.06em;
    text-transform:uppercase;
    border:none;border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-add{background:var(--copper);color:#1a1206;font-weight:700;margin-top:14px;}
  .btn-add:hover{filter:brightness(1.08);}
  .btn-deposit{background:var(--pine);color:#eafff2;}
  .btn-withdraw{background:var(--rust);color:#ffe9e3;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--paper);border-color:var(--muted);}

  /* ---- goal ticket ---- */
  .goal{
    position:relative;
    background:var(--paper);
    color:#1c1712;
    border-radius:2px;
    margin-bottom:26px;
    padding:20px 22px 18px;
    box-shadow:0 14px 30px -14px rgba(0,0,0,0.55);
  }
  .goal::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:6px;
    background-image:radial-gradient(circle, var(--ink) 2.6px, transparent 2.7px);
    background-size:14px 14px;
    background-position:2px -6px;
  }
  .goal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px;}
  .goal-title{font-family:'Fraunces',serif;font-weight:700;font-size:20px;line-height:1.15;}
  .goal-target{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5c5346;margin-top:4px;}
  .del{background:none;border:none;color:#8a7c66;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;}
  .del:hover{color:var(--rust);}
  .edit-btn:hover{color:var(--pine);}
  .edit-form{padding:8px 2px;}
  .edit-form label{color:#7a6f5c;}
  .edit-form input, .edit-form select{background:#fff;color:#1c1712;border:1px solid #cfc4a8;}

  .stamp{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;font-weight:700;
    color:var(--pine);
    border:1.5px solid var(--pine);
    border-radius:4px;
    padding:3px 8px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }
  .stamp.over{color:var(--rust);border-color:var(--rust);}

  .bar-row{margin:14px 0 6px;}
  .tally{
    display:flex;gap:2px;height:16px;
    background:repeating-linear-gradient(90deg, #d8cfb8 0 1px, transparent 1px 8px);
    border:1px solid #cfc4a8;
    border-radius:3px;
    overflow:hidden;
  }
  .tally-fill{
    background:repeating-linear-gradient(115deg, var(--copper) 0 6px, var(--copper-bright) 6px 12px);
    height:100%;
    transition:width .35s ease;
  }
  .saved-line{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;color:#4a4335;margin-top:8px;
  }
  .saved-line b{color:#1c1712;}

  .txn-form{
    display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;
    border-top:1px dashed #cfc4a8;
    padding-top:14px;
  }
  .txn-form input, .txn-form select{
    background:#fff; color:#1c1712; border:1px solid #cfc4a8;
  }
  .txn-form .field{min-width:90px;}
  .txn-form label{color:#7a6f5c;}

  details{margin-top:12px;}
  summary{
    cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:#7a6f5c;letter-spacing:0.06em;text-transform:uppercase;
    outline:none;
  }
  .txn-log{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .txn-log-row{
    display:flex;justify-content:space-between;
    padding:5px 0;border-bottom:1px solid #ece4d0;
  }
  .txn-log-row .amt.dep{color:var(--pine);}
  .txn-log-row .amt.wd{color:var(--rust);}
  .txn-log-empty{color:#a89c85;font-size:12px;padding:6px 0;}
  .txn-del{
    background:none;border:none;cursor:pointer;
    color:#a89c85;font-size:12px;line-height:1;padding:2px 3px;
  }
  .txn-del:hover{color:var(--rust);}

  .empty-state{
    text-align:center;padding:50px 20px;color:var(--muted);
    border:1px dashed var(--line);border-radius:10px;
  }
  .empty-state span{display:block;font-family:'Fraunces',serif;font-size:18px;color:var(--paper);margin-bottom:6px;}

  .settings{
    margin-top:36px;padding-top:18px;border-top:1px solid var(--line);
  }
  .settings summary{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;}
  .rate-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .rate-row .field label{color:var(--muted);}
  .rate-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--copper);color:#1a1206;font-family:'JetBrains Mono',monospace;
    font-size:12px;padding:9px 16px;border-radius:6px;
    opacity:0;transition:all .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:480px){
    .goal-head{flex-direction:column;}
    .stamp{align-self:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Savings Ledger</div>
  <h1>存钱台账</h1>
  <div class="sub">设定目标，随时存入或取出 NZD / CNY / USD，退出重进不清零。</div>

  <div class="totals" id="totals"></div>

  <div class="add-card">
    <h2>+ 新建目标</h2>
    <div class="row">
      <div class="field" style="flex:2;">
        <label>目标名称</label>
        <input id="newTitle" type="text" placeholder="例如：新西兰学费 / 新 iPhone">
      </div>
      <div class="field">
        <label>目标金额</label>
        <input id="newAmount" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="field">
        <label>目标币种</label>
        <select id="newCurrency">
          <option value="NZD">NZD</option>
          <option value="CNY">CNY</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>
    <button class="btn btn-add" onclick="addGoal()">建立目标</button>
  </div>

  <div id="goalsList"></div>

  <details class="settings">
    <summary>汇率设置 · Exchange Rates</summary>
    <div class="rate-row">
      <div class="field">
        <label>1 USD =</label>
        <input type="number" id="rateUSD" value="1" disabled>
      </div>
      <div class="field">
        <label>NZD</label>
        <input type="number" step="0.0001" id="rateNZD">
      </div>
      <div class="field">
        <label>CNY</label>
        <input type="number" step="0.0001" id="rateCNY">
      </div>
      <div class="field">
        <label>AUD</label>
        <input type="number" step="0.0001" id="rateAUD">
      </div>
      <button class="btn btn-ghost" style="align-self:flex-end;" onclick="saveRates()">保存汇率</button>
    </div>
    <div class="rate-note">以上为估算汇率，仅用于目标进度换算，非实时行情。可自行修改为当天银行牌价。</div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'savings-ledger-data';
const CURRENCIES = ['NZD','CNY','USD','AUD'];
const SYMBOLS = { NZD:'NZ$', CNY:'¥', USD:'$', AUD:'A$' };

let state = {
  goals: [],
  rates: { USD:1, NZD:1.66, CNY:6.75, AUD:1.53 } // units per 1 USD
};

let editingGoalId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function convert(amount, from, to){
  if(from === to) return amount;
  const usd = amount / state.rates[from];
  return usd * state.rates[to];
}

function fmt(n){
  return (Math.round(n*100)/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.goals = parsed.goals || [];
      state.rates = Object.assign({}, state.rates, parsed.rates || {});
    }
  }catch(e){
    // no saved data yet, keep defaults
  }
  document.getElementById('rateNZD').value = state.rates.NZD;
  document.getElementById('rateCNY').value = state.rates.CNY;
  document.getElementById('rateAUD').value = state.rates.AUD;
  render();
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    showToast('保存失败，请重试');
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}

function goalSaved(goal){
  return goal.transactions.reduce((sum, tx)=>{
    const amt = convert(tx.amount, tx.currency, goal.targetCurrency);
    return tx.type === 'deposit' ? sum + amt : sum - amt;
  }, 0);
}

function addGoal(){
  const title = document.getElementById('newTitle').value.trim();
  const amount = parseFloat(document.getElementById('newAmount').value);
  const currency = document.getElementById('newCurrency').value;
  if(!title){ showToast('请填写目标名称'); return; }
  if(!amount || amount <= 0){ showToast('请填写有效的目标金额'); return; }

  state.goals.unshift({
    id: uid(),
    title,
    targetAmount: amount,
    targetCurrency: currency,
    transactions: []
  });
  document.getElementById('newTitle').value = '';
  document.getElementById('newAmount').value = '';
  saveData();
  render();
  showToast('目标已建立');
}

function deleteGoal(id){
  state.goals = state.goals.filter(g => g.id !== id);
  saveData();
  render();
}

function startEditGoal(id){
  editingGoalId = id;
  render();
}

function cancelEditGoal(){
  editingGoalId = null;
  render();
}

function saveEditGoal(id){
  const title = document.getElementById('edit-title-'+id).value.trim();
  const amount = parseFloat(document.getElementById('edit-amount-'+id).value);
  const currency = document.getElementById('edit-currency-'+id).value;
  if(!title){ showToast('名称不能为空'); return; }
  if(!amount || amount <= 0){ showToast('请输入有效的目标金额'); return; }

  const goal = state.goals.find(g => g.id === id);
  goal.title = title;
  goal.targetAmount = amount;
  goal.targetCurrency = currency;
  editingGoalId = null;
  saveData();
  render();
  showToast('目标已更新');
}

function addTransaction(goalId, type){
  const amountInput = document.getElementById('amt-'+goalId);
  const currencyInput = document.getElementById('cur-'+goalId);
  const amount = parseFloat(amountInput.value);
  const currency = currencyInput.value;
  if(!amount || amount <= 0){ showToast('请输入有效金额'); return; }

  const goal = state.goals.find(g => g.id === goalId);
  goal.transactions.unshift({
    id: uid(),
    type,
    currency,
    amount,
    date: new Date().toISOString().slice(0,10),
    createdAt: Date.now()
  });
  amountInput.value = '';
  saveData();
  render();
  showToast(type === 'deposit' ? '已存入' : '已取出');
}

function deleteTransaction(goalId, txId){
  const goal = state.goals.find(g => g.id === goalId);
  if(!goal) return;
  goal.transactions = goal.transactions.filter(tx => tx.id !== txId);
  saveData();
  render();
  showToast('记录已删除');
}

function saveRates(){
  const nzd = parseFloat(document.getElementById('rateNZD').value);
  const cny = parseFloat(document.getElementById('rateCNY').value);
  const aud = parseFloat(document.getElementById('rateAUD').value);
  if(nzd > 0) state.rates.NZD = nzd;
  if(cny > 0) state.rates.CNY = cny;
  if(aud > 0) state.rates.AUD = aud;
  saveData();
  render();
  showToast('汇率已更新');
}

function renderTotals(){
  const el = document.getElementById('totals');
  if(state.goals.length === 0){ el.innerHTML=''; return; }
  const grand = {};
  CURRENCIES.forEach(c => grand[c] = 0);
  state.goals.forEach(g => {
    const saved = goalSaved(g);
    CURRENCIES.forEach(c => grand[c] += convert(saved, g.targetCurrency, c));
  });
  el.innerHTML = CURRENCIES.map(c => `
    <div class="t-item">
      <span class="t-label">总计 · ${c}</span>
      <span class="t-value">${SYMBOLS[c]}${fmt(grand[c])}</span>
    </div>
  `).join('');
}

function render(){
  renderTotals();
  const list = document.getElementById('goalsList');

  if(state.goals.length === 0){
    list.innerHTML = `<div class="empty-state"><span>还没有目标</span>在上方建立第一个存钱目标吧</div>`;
    return;
  }

  list.innerHTML = state.goals.map(g => {
    const currencyOptions = CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join('');

    if(editingGoalId === g.id){
      const editCurrencyOptions = CURRENCIES.map(c => `<option value="${c}" ${c===g.targetCurrency?'selected':''}>${c}</option>`).join('');
      return `
        <div class="goal">
          <div class="edit-form">
            <div class="row">
              <div class="field" style="flex:2;">
                <label>目标名称</label>
                <input type="text" id="edit-title-${g.id}" value="${escapeHtml(g.title)}">
              </div>
              <div class="field">
                <label>目标金额</label>
                <input type="number" min="0" step="0.01" id="edit-amount-${g.id}" value="${g.targetAmount}">
              </div>
              <div class="field">
                <label>目标币种</label>
                <select id="edit-currency-${g.id}">${editCurrencyOptions}</select>
              </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;">
              <button class="btn btn-add" onclick="saveEditGoal('${g.id}')">保存</button>
              <button class="btn btn-ghost" onclick="cancelEditGoal()">取消</button>
            </div>
          </div>
        </div>
      `;
    }

    const saved = goalSaved(g);
    const pct = Math.max(0, Math.min(100, (saved / g.targetAmount) * 100));
    const over = saved > g.targetAmount;

    const DELETE_WINDOW_MS = 3 * 60 * 1000;
    const txnLog = g.transactions.length === 0
      ? `<div class="txn-log-empty">暂无记录</div>`
      : g.transactions.map(tx => {
          const canDelete = tx.createdAt && (Date.now() - tx.createdAt) <= DELETE_WINDOW_MS;
          return `
          <div class="txn-log-row">
            <span>${tx.date} · ${tx.type === 'deposit' ? '存入' : '取出'}</span>
            <span style="display:flex;align-items:center;gap:8px;">
              <span class="amt ${tx.type === 'deposit' ? 'dep' : 'wd'}">
                ${tx.type === 'deposit' ? '+' : '-'}${SYMBOLS[tx.currency]}${fmt(tx.amount)}
              </span>
              ${canDelete ? `<button class="txn-del" onclick="deleteTransaction('${g.id}','${tx.id}')" title="删除这条记录（3分钟内可撤销）">✕</button>` : ''}
            </span>
          </div>
        `;
        }).join('');

    return `
      <div class="goal">
        <div class="goal-head">
          <div>
            <div class="goal-title">${escapeHtml(g.title)}</div>
            <div class="goal-target">目标 ${SYMBOLS[g.targetCurrency]}${fmt(g.targetAmount)} ${g.targetCurrency}</div>
          </div>
          <div style="display:flex;align-items:flex-start;gap:8px;">
            <div class="stamp ${over ? 'over' : ''}">${pct.toFixed(0)}%</div>
            <button class="del edit-btn" onclick="startEditGoal('${g.id}')" title="编辑目标">✎</button>
            <button class="del" onclick="deleteGoal('${g.id}')" title="删除目标">✕</button>
          </div>
        </div>

        <div class="bar-row">
          <div class="tally"><div class="tally-fill" style="width:${pct}%;"></div></div>
        </div>
        <div class="saved-line">
          已存 <b>${SYMBOLS[g.targetCurrency]}${fmt(saved)}</b> / ${SYMBOLS[g.targetCurrency]}${fmt(g.targetAmount)} ${g.targetCurrency}
          ${over ? ' · 已超出目标' : ''}
        </div>

        <div class="txn-form">
          <div class="field">
            <label>金额</label>
            <input type="number" min="0" step="0.01" id="amt-${g.id}" placeholder="0.00">
          </div>
          <div class="field">
            <label>币种</label>
            <select id="cur-${g.id}">${currencyOptions}</select>
          </div>
          <button class="btn btn-deposit" onclick="addTransaction('${g.id}','deposit')" style="align-self:flex-end;">存入</button>
          <button class="btn btn-withdraw" onclick="addTransaction('${g.id}','withdraw')" style="align-self:flex-end;">取出</button>
        </div>

        <details>
          <summary>交易记录 (${g.transactions.length})</summary>
          <div class="txn-log">${txnLog}</div>
        </details>
      </div>
    `;
  }).join('');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadData();
setInterval(render, 15000);
</script>
</body>
</html>
